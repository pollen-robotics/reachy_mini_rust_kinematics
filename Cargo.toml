[package]
name = "reachy_mini_rust_kinematics"
version = "1.0.3"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["python"]
python = ["pyo3", "pyo3-log", "pyo3-stub-gen", "rust-numpy"]

[dependencies]
env_logger = "0.11.8"
nalgebra = "0.32.3"
pyo3 = { version = "0.25.0", optional = true }
pyo3-log = { version = "0.12.4", optional = true }
pyo3-stub-gen = { version = "0.9.0", optional = true }
rust-numpy = { version = "0.1.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "kinematics_bench"
harness = false

[[bin]]
name = "stub_gen"
required-features = ["python"]
