name: WASM build

on: [pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: wasm32-unknown-unknown
        override: true
    - name: Install wasm-pack
      run: cargo install wasm-pack
    - name: Build wasm package
      run: wasm-pack build --target web --no-default-features --features wasm
    - name: Copy kinematics_data.json to pkg
      run: cp kinematics_data.json pkg/kinematics_data.json
    - name: Upload WASM build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: reachy-mini-wasm
        path: pkg/
